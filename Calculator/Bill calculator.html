<!DOCTYPE html>

<html lang="en">
    <head>
        <title>bill splitter</title>
        <link rel="stylesheet" href="Bill style.CSS">


    </head>
    <body>
        <div class="container">
            <h1>bill splitter</h1>
            


 <h1>Bill Splitter</h1>

<label>Bill Amount ($)</label>
<input type="number" id="bill" placeholder="Enter bill amount">

<label>Tip Percentage</label>
<select id="tip">
<option value="5">5%</option>
<option value="10">10%</option>
<option value="15">15%</option>
<option value="20">20%</option>
<option value="25">25%</option>
</select>

<label>Number of People</label>
<input type="number" id="people" placeholder="Enter people">

<div class="buttons">
<button onclick="calculate()">Calculate</button>
<button onclick="resetFields()">Reset</button>
</div>

<div class="result">
<h3>Tip Amount: <span id="tipAmount">$0.00</span></h3>
<h3>Total Bill: <span id="total">$0.00</span></h3>
<h3>Per Person: <span id="perPerson">$0.00</span></h3>
</div>
</div>
        </div>
    </body>
    </html>
