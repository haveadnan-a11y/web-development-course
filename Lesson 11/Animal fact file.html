<!DOCTYPE html>
<html?>
    <head>
        <title>My animal fact file</title>
    
    <style>
        /* Page background- sets the color and font for the whole page*/
        body{
            background-color: darkgreen;
            font-family: Arial,san-serif;

        }
        /* Box model- width sets the content area
        padding pushes the text away from the edges
        border draws a visible frame around the font file
        /* margin pushes the fact file away from the screen edge */
        .fact-file{
            background-color: lightyellow;
            color: darkslategray;
            width: 260px;
            padding: 25px;
            border: 4px solid forestgreen;
            margin: 30px;
        }
        /* /* Animal name- forest green so it stands out */
.animal-name{
    color: forestgreen;
    font-size: 22px;

}
/* Detail row- dark text on the light background*/
.detail{
    color: darkslategrey;

}
/* Cool fact- orange and italic to make it feel special*/
.cool-fact {
    color:v darkorange;
    font-style: italic;

}

    </style>
</head>
<body>
    <div class="fact-file">
<h2 class="animal-name">Snow leapord</h2>
<p class="detail">Type: Big cat</h2>
    <p class="detail">Lives in: Mountain ranges of central asia</p>
    <p class="detail">Diet: deer,goats and wild sheep</p>
    <p class="cool-fact">Cool-fact : can leap up 15m in air in one jump!</p>
    
    </div>
</body>
</html>
