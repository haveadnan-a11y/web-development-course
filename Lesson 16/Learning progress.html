<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Student learning progress</title>
        <link rel="stylesheet"

href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
<style>
    .body{
        background-color:#f5f5f5;

    }
    .section{
        background-color:white;
        padding:25px;
        margin-top:20px;
        border-radius:10px;
    }
.progress{
    height:20px;
}




</style>

    </head>
    <body>
        <div class="container">
            <div class="jumbotron text-center mt-4">
                <h1 class="display-4">My Learning Progress</h1>
                <p>Track completed course and achievements</p>
                <button class="btn btn-primary">
                    View courses
                </button>
                <button class="btn btn-success">
                    View certificates
                </button>

            </div>
            <div class="section">
                <h3>Achievements</h3>
                <p>
                    HTML
                    <span class="badge badge-success">Completed</span>
                </p>
                <p>
                    CSS
                    <span class="badge badge-info">Good</span>
                    </p>
                    <p>
                        Bootstrap

                    </p>

            </div>
            <div class="section">
                <h3>Course completion</h3>
                <p>HTML</p>
                <div class="progress">
                    <div class="progress-bar bg-success" style="width: 90%;">90%</div>
                </div>
            </div>
        </div>
        
    </body>
</html>
