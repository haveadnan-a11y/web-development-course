<!DOCTYPE html>
<html>
    <body>
        <h1>Operators</h1>
        <p id="demo"></p>
      <p id="demo1"></p>
    <p id="demo2"></p>


        <script>
        <!--Multiplication-->
        //*use +, -, *, /operators*/
        var x=5;
        var y=2;
        var z=x*y;
        document.getElementById("demo").innerHTML="Multiplication "+z;
        z=x-y;
        document.getElementById("demo1").innerHTML="Subtraction "+z;
        x=10;
        z=x/y;
        document.getElementById("demo2").innerHTML="Division "+z;
        </script>
    </body>
</html>
