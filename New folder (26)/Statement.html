<!DOCTYPE html>
<html>
    <body>
        <h1>Javascript Statements</h1>
        <p>A <b>Javascript program </b>is a list of <b>statements</b>to be executed by a computer</p>
        <p id="demo"></p>
        <script>
            var x,y,z;//Statement 1
            x=4;//Statement 2
            y=2;//Statement 3
            z=x+y;//Statement 4
            document.getElementById("demo").innerHTML="The total sum is:"+z;

        </script>
    </body>
</html>
